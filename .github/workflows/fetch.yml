name: Fetch tech blog feeds

on:
  schedule:
    # 毎日 06:17 JST（21:17 UTC）。Claude の取り込み（06:49 JST）より前に終わらせる
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds
        run: python3 scripts/fetch_feeds.py 30

      - name: Commit data if changed
        run: |
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update feeds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
